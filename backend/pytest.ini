[pytest]
testpaths = tests
asyncio_mode = auto
# Suppress passlib/pydantic deprecation warnings in output
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::sqlalchemy.exc.SAWarning
# Show short tracebacks by default
addopts = --tb=short -q
