services:
  postgres:
    image: postgres:15-alpine
    container_name: krishix-db
    environment:
      POSTGRES_USER: ${DB_USER:-krishix_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-krishix_password}
      POSTGRES_DB: ${DB_NAME:-krishix_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00-init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishix_user -d krishix_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - krishix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishix-api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-krishix_user}:${DB_PASSWORD:-krishix_password}@postgres:5432/${DB_NAME:-krishix_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Allow requests from both browser and Next.js server-side proxy
      CORS_ORIGINS: http://localhost:3000,http://krishix-web:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - krishix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: http://krishix-api:8000
    container_name: krishix-web
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - krishix-network

volumes:
  postgres_data:

networks:
  krishix-network:
    driver: bridge
